<section class="page-title">

<h1>SOLAR PROBLEM REPORT</h1>

<!-- ================= REPORT SECTION ================= -->

<section class="report-container">

<!-- Left Side -->

<div class="report-form">

<h2>Report Your Problem</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="text" placeholder="WhatsApp Number">

<input type="text" placeholder="Address">

<select>

<option>Select City</option>

<option>Karachi</option>

<option>Lahore</option>

<option>Islamabad</option>

<option>Hyderabad</option>

</select>

<select>

<option>System Size</option>

<option>3kW</option>

<option>5kW</option>

<option>10kW</option>

<option>15kW</option>

</select>

<input type="text" placeholder="Inverter Brand">

<input type="date">

<h3>Select Problem</h3>

<div class="checkbox-group">

<label><input type="checkbox"> No Electricity</label>

<label><input type="checkbox"> High Electricity Bill</label>

<label><input type="checkbox"> Inverter Error</label>

<label><input type="checkbox"> Battery Not Charging</label>

<label><input type="checkbox"> Solar Panels Not Working</label>

<label><input type="checkbox"> Net Metering Issue</label>

<label><input type="checkbox"> Wiring Problem</label>

<label><input type="checkbox"> Other</label>

</div>

<textarea rows="6"
placeholder="Describe your problem..."></textarea>

<label class="upload">

Upload Problem Image

<input type="file">

</label>

<button type="submit">
Submit Problem
</button>

</form>
</div>

<!-- Right Side -->

<div class="report-image">

<img src="enginer.jpg" alt="Solar">

<div class="support-box">

<div class="support-item">
<i class="fa-solid fa-bolt"></i>
<span>Fast Technical Support</span>
</div>

<div class="support-item">
<i class="fa-solid fa-screwdriver-wrench"></i>
<span>Experienced Engineers</span>
</div>

<div class="support-item">
<i class="fa-brands fa-whatsapp"></i>
<span>WhatsApp Assistance</span>
</div>

<div class="support-item">
<i class="fa-solid fa-clock"></i>
<span>24/7 Customer Support</span>
</div>

</div>

</div>

</section>
